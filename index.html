<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KOD_LINGVOKVESTA — Sage Storybook Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #98B78C;
    --sage-deep: #6A8E60;
    --olive: #5C7A52;
    --cream: #F5F0E6;
    --beige: #E8DFD0;
    --terracotta: #C47A5A;
    --muted-rose: #B87A7A;
    --warm-gold: #D4A84B;
    --lcd-green: #9BBC0F;
    --lcd-dark: #0F380F;
    --shadow-deep: rgba(40, 50, 35, 0.55);
    --console-scale: 1;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: 
      radial-gradient(ellipse at 30% 20%, rgba(212, 168, 75, 0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(152, 183, 140, 0.18) 0%, transparent 55%),
      linear-gradient(165deg, #1a1f18 0%, #0e110d 40%, #151a14 100%);
    font-family: 'VT323', monospace;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .atmosphere {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .bokeh {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.38;
    pointer-events: none;
  }
  .b1 { width: 520px; height: 520px; background: #98b78c; top: -160px; left: -140px; animation: floatA 22s infinite ease-in-out; }
  .b2 { width: 420px; height: 420px; background: #d4a84b; bottom: -120px; right: -80px; animation: floatB 18s infinite ease-in-out; }
  .b3 { width: 280px; height: 280px; background: #b87a7a; top: 35%; right: 12%; animation: floatA 26s infinite ease-in-out reverse; opacity: 0.22; }
  .b4 { width: 180px; height: 180px; background: #7a9ba8; bottom: 25%; left: 15%; animation: floatB 20s infinite ease-in-out; opacity: 0.2; }

  @keyframes floatA {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(50px, 35px) scale(1.05); }
  }
  @keyframes floatB {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-40px, -45px) scale(1.08); }
  }

  .vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(8, 10, 7, 0.55) 100%);
    pointer-events: none;
    z-index: 2;
  }

  .scene {
    perspective: 1400px;
    position: relative;
    z-index: 1;
    transform: scale(var(--console-scale));
    transform-origin: center center;
  }

  .console {
    width: 700px;
    height: 720px;
    background: linear-gradient(145deg, 
      rgba(245, 240, 230, 0.22) 0%,
      rgba(152, 183, 140, 0.28) 35%,
      rgba(106, 142, 96, 0.32) 70%,
      rgba(92, 122, 82, 0.25) 100%);
    backdrop-filter: blur(18px) saturate(1.15);
    -webkit-backdrop-filter: blur(18px) saturate(1.15);
    border-radius: 32px;
    border: 1.5px solid rgba(255, 255, 255, 0.35);
    box-shadow:
      0 0 80px rgba(152, 183, 140, 0.28),
      0 0 140px rgba(212, 168, 75, 0.08),
      0 40px 80px var(--shadow-deep),
      0 18px 30px rgba(0, 0, 0, 0.35),
      inset 0 2px 4px rgba(255, 255, 255, 0.45),
      inset 0 -3px 8px rgba(40, 50, 35, 0.18);
    display: flex;
    flex-direction: column;
    padding: 28px 36px 32px;
    position: relative;
    transform: rotateX(6deg) rotateY(-2deg);
    transform-style: preserve-3d;
  }

  .top-section {
    display: flex;
    justify-content: center;
    margin-bottom: 18px;
  }

  .screen-bezel {
    background: linear-gradient(160deg, #1c1c1a 0%, #0e0e0c 100%);
    border-radius: 16px;
    padding: 18px;
    box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.85), 0 3px 0 rgba(255, 255, 255, 0.12);
    width: 460px;
    height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .screen-lcd {
    width: 100%;
    height: 100%;
    background: var(--lcd-green);
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }

  #canvas {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(15, 56, 15, 0.09) 2px, rgba(15, 56, 15, 0.09) 4px);
    pointer-events: none;
    z-index: 2;
  }

  .bottom-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .controls-wrapper {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 12px;
    margin-top: 22px;
  }

  /* D-PAD */
  .dpad {
    position: relative;
    width: 176px;
    height: 176px;
  }

  .d-btn {
    position: absolute;
    width: 54px;
    height: 54px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    background: linear-gradient(160deg, #3a4636 0%, #2a3228 100%);
    box-shadow: 0 4px 0 #1a2118, 0 6px 12px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .d-btn::after {
    content: '';
    width: 0;
    height: 0;
    border-style: solid;
    opacity: 0.75;
  }

  .d-up { top: 0; left: 61px; }
  .d-up::after { border-width: 0 9px 12px 9px; border-color: transparent transparent #c8d4b8 transparent; }

  .d-left { top: 61px; left: 0; }
  .d-left::after { border-width: 9px 12px 9px 0; border-color: transparent #c8d4b8 transparent transparent; }

  .d-right { top: 61px; left: 122px; }
  .d-right::after { border-width: 9px 0 9px 12px; border-color: transparent transparent transparent #c8d4b8; }

  .d-down { top: 122px; left: 61px; }
  .d-down::after { border-width: 12px 9px 0 9px; border-color: #c8d4b8 transparent transparent transparent; }

  .d-btn.pressed {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #1a2118, inset 0 2px 4px rgba(0,0,0,0.4);
    filter: brightness(0.85);
  }

  /* A / B */
  .ab-group {
    display: flex;
    gap: 32px;
    align-items: center;
    transform: rotate(-14deg);
  }

  .ab-btn {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 18px;
    color: rgba(255, 245, 230, 0.9);
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .btn-a {
    background: linear-gradient(150deg, #d48a6a 0%, #b86a4a 100%);
    box-shadow: 0 6px 0 #7a3e2a, 0 10px 20px rgba(120, 50, 30, 0.35), inset 0 2px 3px rgba(255,220,190,0.35);
  }

  .btn-b {
    background: linear-gradient(150deg, #c48a8a 0%, #a86868 100%);
    box-shadow: 0 6px 0 #6e3a3a, 0 10px 20px rgba(100, 40, 40, 0.3), inset 0 2px 3px rgba(255,210,210,0.3);
  }

  .ab-btn.pressed {
    transform: translateY(4px);
    filter: brightness(0.9);
  }

  /* SELECT / START */
  .ss-group {
    display: flex;
    gap: 36px;
    justify-content: center;
    margin-top: 18px;
  }

  .ss-btn {
    width: 118px;
    height: 42px;
    border: none;
    border-radius: 22px;
    cursor: pointer;
    background: linear-gradient(180deg, #e8dfd0 0%, #d4c8b4 100%);
    box-shadow: 0 4px 0 #b8a890, inset 0 1px 2px rgba(255,255,255,0.6);
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #5a5040;
    letter-spacing: 1px;
    text-transform: uppercase;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .ss-btn.pressed {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #b8a890, inset 0 2px 4px rgba(0,0,0,0.15);
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 6px;
    margin-top: 18px;
  }

  .footer-text {
    font-family: 'VT323', monospace;
    font-size: 17px;
    color: rgba(245, 240, 230, 0.65);
    letter-spacing: 1.5px;
    cursor: pointer;
  }

  .battery-icon {
    width: 34px;
    height: 15px;
    border: 1.5px solid rgba(245, 240, 230, 0.5);
    border-radius: 3px;
    padding: 2px;
    position: relative;
  }

  .battery-icon::after {
    content: '';
    position: absolute;
    right: -5px;
    top: 3.5px;
    width: 3px;
    height: 7px;
    background: rgba(245, 240, 230, 0.5);
    border-radius: 0 1px 1px 0;
  }

  .battery-fill {
    width: 72%;
    height: 100%;
    background: linear-gradient(90deg, #98b78c, #b8d4a8);
    border-radius: 1px;
  }

  /* ========== MOBILE ========== */
    /* ========== MOBILE ========== */
  @media (max-width: 760px) {
    :root { --console-scale: 0.82; }
  }

  @media (max-width: 620px) {
    :root { --console-scale: 0.74; }
  }

  @media (max-width: 520px) {
    :root { --console-scale: 0.64; }

    .console {
      padding: 12px 10px 14px;
      border-radius: 22px;
      height: auto;
      min-height: 0;
    }

    .screen-bezel {
      width: 360px;
      height: 255px;
      padding: 10px;
    }

    .controls-wrapper {
      justify-content: center;
      gap: 22px;
      padding: 0;
      margin-top: 10px;
    }

    .dpad {
      width: 158px;
      height: 158px;
      flex-shrink: 0;
    }

    .d-btn {
      width: 56px;
      height: 56px;
      border-radius: 14px;
    }

    .d-up    { top: 0;     left: 51px; }
    .d-left  { top: 51px;  left: 0; }
    .d-right { top: 51px;  left: 102px; }
    .d-down  { top: 102px; left: 51px; }

    .d-up::after    { border-width: 0 11px 14px 11px; }
    .d-left::after  { border-width: 11px 14px 11px 0; }
    .d-right::after { border-width: 11px 0 11px 14px; }
    .d-down::after  { border-width: 14px 11px 0 11px; }

    .ab-group {
      gap: 12px;
      transform: rotate(-8deg);
    }

    .ab-btn {
      width: 68px;
      height: 68px;
      font-size: 15px;
    }

    .ss-group {
      gap: 16px;
      margin-top: 12px;
    }

    .ss-btn {
      width: 108px;
      height: 42px;
      font-size: 8px;
    }

    .footer {
      margin-top: 10px;
    }

    .footer-text {
      font-size: 12px;
      letter-spacing: 1px;
    }
  }

  @media (max-width: 420px) {
    :root { --console-scale: 0.56; }

    .screen-bezel {
      width: 340px;
      height: 240px;
    }

    .dpad {
      width: 148px;
      height: 148px;
    }

    .d-btn {
      width: 52px;
      height: 52px;
    }

    .d-up    { left: 48px; }
    .d-left  { top: 48px; }
    .d-right { top: 48px; left: 96px; }
    .d-down  { top: 96px; left: 48px; }

    .ab-btn {
      width: 64px;
      height: 64px;
      font-size: 14px;
    }

    .ss-btn {
      width: 100px;
      height: 40px;
    }
  }

  @media (max-width: 360px) {
    :root { --console-scale: 0.50; }
  }

  /* Дополнительная защита по высоте экрана */
  @media (max-height: 780px) {
    :root { --console-scale: 0.68; }
  }

  @media (max-height: 720px) {
    :root { --console-scale: 0.60; }
  }

  @media (max-height: 680px) {
    :root { --console-scale: 0.55; }
  }

  @media (max-height: 640px) {
    :root { --console-scale: 0.50; }
  }

  @media (max-height: 600px) {
    :root { --console-scale: 0.46; }
  }

  /* Landscape */
  @media (max-height: 500px) and (orientation: landscape) {
    :root { --console-scale: 0.52; }
  }

  @media (max-height: 450px) and (orientation: landscape) {
    :root { --console-scale: 0.44; }
  }
</style>
</head>
<body>

<div class="atmosphere">
  <div class="bokeh b1"></div>
  <div class="bokeh b2"></div>
  <div class="bokeh b3"></div>
  <div class="bokeh b4"></div>
</div>
<div class="vignette"></div>

<div class="scene">
  <div class="console">
    <div class="top-section">
      <div class="screen-bezel">
        <div class="screen-lcd">
          <canvas id="canvas" width="440" height="330"></canvas>
          <div class="scanlines"></div>
        </div>
      </div>
    </div>

    <div class="bottom-section">
      <div class="controls-wrapper">
        <div class="dpad">
          <button class="d-btn d-up" data-key="up"></button>
          <button class="d-btn d-left" data-key="left"></button>
          <button class="d-btn d-right" data-key="right"></button>
          <button class="d-btn d-down" data-key="down"></button>
        </div>

        <div class="ab-group">
          <button class="ab-btn btn-b" data-key="b">B</button>
          <button class="ab-btn btn-a" data-key="a">A</button>
        </div>
      </div>

      <div class="ss-group">
        <button class="ss-btn btn-select" data-key="select">Select</button>
        <button class="ss-btn btn-start" data-key="start">Start</button>
      </div>

      <div class="footer">
        <span class="footer-text">KOD_LINGVOKVESTA OS 1.0</span>
        <div class="battery">
          <div class="battery-icon"><div class="battery-fill"></div></div>
        </div>
        <span class="footer-text" id="soundToggle">SOUND: ON</span>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

const W = 440, H = 330, CELL = 22;
const GRID_COLS = 18, GRID_ROWS = 10;
const GRID_X = 22, GRID_Y = 90;
const MOVE_BASE = 280;
const QUESTIONS_PER_LEVEL = 8;

const C_LCD_BG = '#9BBC0F';
const C_LCD_DARK = '#0F380F';

const SENTENCES = {
  1: [
    {text:"I ___ a student.",answer:"AM",full:"I am a student.",pronoun:"I"},
    {text:"You ___ my friend.",answer:"ARE",full:"You are my friend.",pronoun:"YOU"},
    {text:"He ___ from London.",answer:"IS",full:"He is from London.",pronoun:"HE"},
    {text:"She ___ a teacher.",answer:"IS",full:"She is a teacher.",pronoun:"SHE"},
    {text:"It ___ cold today.",answer:"IS",full:"It is cold today.",pronoun:"IT"},
    {text:"We ___ at school.",answer:"ARE",full:"We are at school.",pronoun:"WE"},
    {text:"They ___ from Brazil.",answer:"ARE",full:"They are from Brazil.",pronoun:"THEY"},
    {text:"I ___ very tired.",answer:"AM",full:"I am very tired.",pronoun:"I"},
    {text:"She ___ 20 years old.",answer:"IS",full:"She is 20 years old.",pronoun:"SHE"},
    {text:"They ___ very happy.",answer:"ARE",full:"They are very happy.",pronoun:"THEY"},
  ],
  2: [
    {text:"We ___ ready for the trip.",answer:"ARE",full:"We are ready for the trip.",pronoun:"WE"},
    {text:"He ___ at home right now.",answer:"IS",full:"He is at home right now.",pronoun:"HE"},
    {text:"She ___ at the library.",answer:"IS",full:"She is at the library.",pronoun:"SHE"},
    {text:"They ___ from Canada.",answer:"ARE",full:"They are from Canada.",pronoun:"THEY"},
    {text:"It ___ very small and light.",answer:"IS",full:"It is very small and light.",pronoun:"IT"},
    {text:"You ___ late again today.",answer:"ARE",full:"You are late again today.",pronoun:"YOU"},
    {text:"I ___ here to help you.",answer:"AM",full:"I am here to help you.",pronoun:"I"},
    {text:"The dog ___ in the garden.",answer:"IS",full:"The dog is in the garden.",pronoun:"IT"},
    {text:"We ___ in the same class.",answer:"ARE",full:"We are in the same class.",pronoun:"WE"},
    {text:"He ___ my best friend.",answer:"IS",full:"He is my best friend.",pronoun:"HE"},
  ],
  3: [
    {text:"My friends ___ at the airport.",answer:"ARE",full:"My friends are at the airport.",pronoun:"THEY"},
    {text:"She ___ not at home today.",answer:"IS",full:"She is not at home today.",pronoun:"SHE"},
    {text:"We ___ excited about the project.",answer:"ARE",full:"We are excited about the project.",pronoun:"WE"},
    {text:"The children ___ in the park.",answer:"ARE",full:"The children are in the park.",pronoun:"THEY"},
    {text:"My brother and I ___ good at math.",answer:"ARE",full:"My brother and I are good at math.",pronoun:"WE"},
    {text:"The weather ___ terrible today.",answer:"IS",full:"The weather is terrible today.",pronoun:"IT"},
    {text:"These books ___ very interesting.",answer:"ARE",full:"These books are very interesting.",pronoun:"THEY"},
    {text:"Everyone ___ ready to start.",answer:"IS",full:"Everyone is ready to start.",pronoun:"EVERYONE"},
    {text:"My sister ___ a doctor in London.",answer:"IS",full:"My sister is a doctor in London.",pronoun:"SHE"},
    {text:"The students ___ in the classroom.",answer:"ARE",full:"The students are in the classroom.",pronoun:"THEY"},
  ]
};

const Storage = {
  get(k, d) { try { const v = localStorage.getItem('kod_lingvokvesta_sage_' + k); return v === null ? d : JSON.parse(v); } catch(e) { return d; } },
  set(k, v) { try { localStorage.setItem('kod_lingvokvesta_sage_' + k, JSON.stringify(v)); } catch(e) {} }
};

const Sound = {
  ctx: null, enabled: true,
  init() {
    this.enabled = Storage.get('sound', true);
    this.updateLabel();
  },
  updateLabel() {
    const el = document.getElementById('soundToggle');
    if (el) el.textContent = 'SOUND: ' + (this.enabled ? 'ON' : 'OFF');
  },
  ensure() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  toggle() {
    this.enabled = !this.enabled;
    Storage.set('sound', this.enabled);
    this.updateLabel();
    if (this.enabled) this.play('click');
  },
  play(type) {
    if (!this.enabled) return;
    this.ensure();
    if (!this.ctx) return;
    const ctx = this.ctx, now = ctx.currentTime;
    const beep = (f, s, d, t = 'square', v = 0.05) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = f; o.type = t;
      g.gain.setValueAtTime(v, now + s);
      g.gain.exponentialRampToValueAtTime(0.001, now + s + d);
      o.start(now + s); o.stop(now + s + d + 0.02);
    };
    switch(type) {
      case 'click': beep(800, 0, 0.04); break;
      case 'move': beep(520, 0, 0.03, 'square', 0.03); break;
      case 'eat': beep(700, 0, 0.05); beep(900, 0.03, 0.04); break;
      case 'correct': beep(523, 0, 0.08); beep(659, 0.08, 0.08); beep(784, 0.16, 0.12); break;
      case 'wrong': beep(330, 0, 0.1, 'sawtooth', 0.06); beep(220, 0.1, 0.18, 'sawtooth', 0.06); break;
      case 'gameOver': beep(440, 0, 0.15); beep(349, 0.15, 0.15); beep(261, 0.3, 0.15); beep(174, 0.45, 0.4); break;
      case 'levelUp': beep(523, 0, 0.08); beep(659, 0.08, 0.08); beep(784, 0.16, 0.08); beep(1047, 0.24, 0.22); break;
      case 'caseComplete': [523,659,784,1047,784,1047,1319].forEach((f,i) => beep(f, i*0.1, 0.14)); break;
    }
  }
};

const Input = {
  handlers: {},
  init() {
    const keymap = {
      'ArrowUp':'up','ArrowDown':'down','ArrowLeft':'left','ArrowRight':'right',
      'z':'a','Z':'a','x':'b','X':'b','Enter':'start','Shift':'select',' ':'start'
    };

    document.addEventListener('keydown', e => {
      if (e.repeat) return;
      const a = keymap[e.key];
      if (a) { e.preventDefault(); this.trigger(a); }
    });

    document.querySelectorAll('[data-key]').forEach(btn => {
      const key = btn.dataset.key;

      const onDown = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (btn.classList.contains('pressed')) return;
        btn.classList.add('pressed');
        this.trigger(key);
      };

      const onUp = (e) => {
        e.preventDefault();
        btn.classList.remove('pressed');
      };

      btn.addEventListener('pointerdown', onDown, { passive: false });
      btn.addEventListener('pointerup', onUp, { passive: false });
      btn.addEventListener('pointerleave', onUp, { passive: false });
      btn.addEventListener('pointercancel', onUp, { passive: false });
      btn.addEventListener('contextmenu', e => e.preventDefault());
    });

    document.getElementById('soundToggle').addEventListener('click', () => Sound.toggle());
  },
  on(action, cb) {
    (this.handlers[action] || (this.handlers[action] = [])).push(cb);
  },
  trigger(action) {
    if (this.handlers[action]) {
      this.handlers[action].forEach(cb => cb());
    }
    // звук немного отложен, чтобы не тормозить реакцию
    if (Sound.enabled) {
      requestAnimationFrame(() => {
        if (action === 'up' || action === 'down' || action === 'left' || action === 'right') Sound.play('move');
        else Sound.play('click');
      });
    }
  }
};

const S = {
  screen: 'BOOT', bootTime: 0,
  menuIndex: 0, gameIndex: 0, levelIndex: 0,
  unlockedLevels: 1, highScore: 0,
  level: 1, score: 0, lives: 3, caseNum: 1, correctCount: 0,
  questions: [], questionIdx: 0, currentQuestion: null,
  snake: [], dir: {x:1,y:0}, nextDir: {x:1,y:0},
  food: [], lastMove: 0, moveInterval: MOVE_BASE,
  timer: 0, maxTimer: 22000,
  fbTime: 0, fbData: null
};

const cv = document.getElementById('canvas');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

function clearScreen() { ctx.fillStyle = C_LCD_BG; ctx.fillRect(0,0,W,H); }
function txt(t,x,y,c,s,a) {
  ctx.fillStyle = c || C_LCD_DARK;
  ctx.font = `${s||14}px "Press Start 2P", monospace`;
  ctx.textAlign = a || 'left'; ctx.textBaseline = 'top';
  ctx.fillText(t,x,y);
}
function ptxt(t,x,y,c,s) {
  ctx.font = `${s}px "Press Start 2P", monospace`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillText(t,x+2,y+2);
  ctx.fillStyle = c; ctx.fillText(t,x,y);
}
function ptxtC(t,y,c,s) {
  ctx.font = `${s}px "Press Start 2P", monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillText(t,W/2+2,y+2);
  ctx.fillStyle = c; ctx.fillText(t,W/2,y);
}
function drawDynamicText(t, y, c, baseSize) {
  let fs = baseSize;
  ctx.font = `${fs}px "Press Start 2P", monospace`;
  let tw = ctx.measureText(t).width;
  while (tw > W - 40 && fs > 8) {
    fs--;
    ctx.font = `${fs}px "Press Start 2P", monospace`;
    tw = ctx.measureText(t).width;
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillText(t, W/2+2, y+2);
  ctx.fillStyle = c; ctx.fillText(t, W/2, y);
}
function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function drawPixelBlock(x,y,w,h) {
  ctx.fillStyle = C_LCD_DARK; ctx.fillRect(x,y,w,h);
  ctx.fillStyle = C_LCD_BG; ctx.fillRect(x+2,y+2,w-4,h-4);
  ctx.fillStyle = C_LCD_DARK; ctx.fillRect(x+4,y+3,w-8,h-6);
}

const Snake = {
  init(level) {
    S.level = level; S.score = 0; S.lives = 3; S.caseNum = 1; S.correctCount = 0;
    S.questions = this.pickQ(level); S.questionIdx = 0;
    S.moveInterval = MOVE_BASE - (level-1)*20;
    this.startQ();
  },
  pickQ(level) {
    const p = [...SENTENCES[level]];
    for (let i = p.length-1; i > 0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [p[i], p[j]] = [p[j], p[i]];
    }
    return p.slice(0, QUESTIONS_PER_LEVEL);
  },
  startQ() {
    S.currentQuestion = S.questions[S.questionIdx];
    const sx = Math.floor(GRID_COLS/2)-1, sy = Math.floor(GRID_ROWS/2);
    S.snake = [{x:sx,y:sy},{x:sx-1,y:sy},{x:sx-2,y:sy}];
    S.dir = {x:1,y:0}; S.nextDir = {x:1,y:0};
    this.spawnFood();
    S.timer = S.maxTimer; S.screen = 'QUESTION_INTRO'; S.fbTime = 0;
  },
  spawnFood() {
    const correctWord = S.currentQuestion.answer;
    const wrongWords = ['AM','IS','ARE'].filter(w => w !== correctWord);
    let words = [correctWord, wrongWords[0], wrongWords[1]];
    for (let i = words.length-1; i > 0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [words[i], words[j]] = [words[j], words[i]];
    }
    const occ = new Set();
    S.snake.forEach(s => occ.add(s.x+','+s.y));
    const validPositions = [];
    for (let y = 0; y < GRID_ROWS; y++) {
      for (let x = 0; x < GRID_COLS-1; x++) {
        if (occ.has(x+','+y) || occ.has((x+1)+','+y)) continue;
        validPositions.push({x,y});
      }
    }
    for (let i = validPositions.length-1; i > 0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [validPositions[i], validPositions[j]] = [validPositions[j], validPositions[i]];
    }
    const pos = [];
    for (const p of validPositions) {
      if (pos.length >= 3) break;
      let overlap = false;
      for (const sp of pos) {
        if (sp.y === p.y && Math.abs(sp.x - p.x) <= 1) { overlap = true; break; }
      }
      if (!overlap) pos.push(p);
    }
    while (pos.length < 3) {
      const rx = Math.floor(Math.random()*(GRID_COLS-1));
      const ry = Math.floor(Math.random()*GRID_ROWS);
      if (!pos.some(sp => sp.x === rx && sp.y === ry)) pos.push({x:rx,y:ry});
    }
    S.food = pos.map((p,i) => ({
      x: p.x, y: p.y, word: words[i], isCorrect: words[i] === S.currentQuestion.answer
    }));
  },
  setDir(dx, dy) {
    if (S.dir.x === -dx && S.dir.y === -dy) return;
    if (S.dir.x === dx && S.dir.y === dy) return;
    S.nextDir = {x:dx, y:dy};
  },
  update(ts) {
    if (S.screen !== 'PLAYING') return;
    if (ts - S.lastMove >= S.moveInterval) {
      S.dir = S.nextDir;
      const h = S.snake[0];
      const nh = {x: (h.x + S.dir.x + GRID_COLS) % GRID_COLS, y: (h.y + S.dir.y + GRID_ROWS) % GRID_ROWS};
      for (let i = 1; i < S.snake.length; i++) {
        if (S.snake[i].x === nh.x && S.snake[i].y === nh.y) {
          this.handleWrong(null);
          return;
        }
      }
      let eaten = null;
      for (const f of S.food) {
        if (nh.y === f.y && (nh.x === f.x || nh.x === f.x+1)) { eaten = f; break; }
      }
      S.snake.unshift(nh);
      if (eaten) { Sound.play('eat'); this.checkAnswer(eaten); }
      else S.snake.pop();
      S.lastMove = ts;
    }
    S.timer -= 16;
    if (S.timer <= 0) this.handleWrong(null);
  },
  checkAnswer(f) {
    S.food = S.food.filter(x => x !== f);
    if (f.isCorrect) this.handleCorrect();
    else this.handleWrong(f);
  },
  handleCorrect() {
    S.score += 100; S.correctCount++; S.caseNum++;
    Sound.play('correct');
    S.screen = 'CORRECT'; S.fbTime = 0; S.fbData = {score:100};
  },
  handleWrong(f) {
    S.lives--; S.caseNum++;
    Sound.play('wrong');
    S.screen = 'WRONG'; S.fbTime = 0;
    const q = S.currentQuestion;
    S.fbData = {chosen: f ? f.word : '---', correct: q.answer, pronoun: q.pronoun, full: q.full, timeout: !f};
  },
  nextQ() {
    S.questionIdx++; S.caseNum++;
    if (S.questionIdx >= S.questions.length) {
      const nl = S.level + 1;
      if (nl <= 3) {
        if (nl > S.unlockedLevels) { S.unlockedLevels = nl; Storage.set('unlockedLevels', nl); }
        Sound.play('levelUp');
        S.level = nl; S.questions = this.pickQ(nl); S.questionIdx = 0;
        S.moveInterval = MOVE_BASE - (nl-1)*20;
        S.screen = 'LEVEL_INTRO'; S.fbTime = 0;
      } else {
        Sound.play('caseComplete');
        if (S.score > S.highScore) { S.highScore = S.score; Storage.set('highScore', S.score); }
        S.screen = 'CASE_COMPLETE'; S.fbTime = 0;
      }
    } else this.startQ();
  },
  drawHUD() {
    ptxt('SCORE:' + String(S.score).padStart(4,'0'), 22, 15, C_LCD_DARK, 12);
    let lv = '';
    for (let i = 0; i < 3; i++) lv += i < S.lives ? '♥ ' : '♡ ';
    ptxt(lv, 200, 15, C_LCD_DARK, 12);
    ptxt('LVL:' + S.caseNum, W-100, 15, C_LCD_DARK, 12);
  },
  drawSentence() {
    if (!S.currentQuestion) return;
    drawDynamicText(S.currentQuestion.text, 45, C_LCD_DARK, 14);
  },
  drawGrid() {
    ctx.strokeStyle = C_LCD_DARK; ctx.lineWidth = 2;
    ctx.strokeRect(GRID_X-2, GRID_Y-2, GRID_COLS*CELL+4, GRID_ROWS*CELL+4);
  },
  drawFood() {
    for (const f of S.food) {
      const x = GRID_X + f.x*CELL, y = GRID_Y + f.y*CELL, w = CELL*2, h = CELL;
      drawPixelBlock(x+1, y+1, w-2, h-2);
      ctx.fillStyle = C_LCD_BG;
      ctx.font = '12px "Press Start 2P", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(f.word || '?', x + w/2, y + h/2 + 1);
    }
  },
  drawSnake() {
    for (let i = 0; i < S.snake.length; i++) {
      const seg = S.snake[i];
      const x = GRID_X + seg.x*CELL, y = GRID_Y + seg.y*CELL;
      if (i === 0) {
        ctx.fillStyle = C_LCD_DARK; ctx.fillRect(x+1,y+1,CELL-2,CELL-2);
        ctx.fillStyle = C_LCD_BG;
        const dx = S.dir.x, dy = S.dir.y;
        if (dx !== 0) {
          ctx.fillRect(x+(dx>0?15:4), y+5, 4, 4);
          ctx.fillRect(x+(dx>0?15:4), y+12, 4, 4);
        } else {
          ctx.fillRect(x+5, y+(dy>0?15:4), 4, 4);
          ctx.fillRect(x+12, y+(dy>0?15:4), 4, 4);
        }
      } else {
        ctx.fillStyle = C_LCD_DARK; ctx.fillRect(x+2,y+2,CELL-4,CELL-4);
        ctx.fillStyle = C_LCD_BG; ctx.fillRect(x+4,y+4,CELL-8,CELL-8);
      }
    }
  },
  drawTimer() {
    const pct = Math.max(0, S.timer / S.maxTimer);
    const bw = W-44, bh = 5, bx = 22, by = 315;
    ctx.fillStyle = C_LCD_DARK; ctx.fillRect(bx-1,by-1,bw+2,bh+2);
    ctx.fillStyle = C_LCD_BG; ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle = C_LCD_DARK; ctx.fillRect(bx,by,bw*pct,bh);
  },
  draw() {
    clearScreen();
    this.drawHUD();
    this.drawSentence();
    this.drawGrid();
    this.drawFood();
    this.drawSnake();
    this.drawTimer();
  },
  drawCorrect() {
    clearScreen(); this.drawHUD(); this.drawTimer();
    const q = S.currentQuestion;
    drawDynamicText(q.text, 80, C_LCD_DARK, 14);
    ptxtC('CORRECT!', 120, C_LCD_DARK, 20);
    ptxtC('+100', 170, C_LCD_DARK, 16);
    drawDynamicText(q.full, 210, C_LCD_DARK, 12);
  },
  drawWrong() {
    clearScreen(); this.drawHUD(); this.drawTimer();
    const t = S.fbTime, fd = S.fbData, q = S.currentQuestion;
    drawDynamicText(q.text, 80, C_LCD_DARK, 14);
    ptxtC(fd.timeout ? 'TIME UP!' : 'WRONG!', 120, C_LCD_DARK, 20);
    ptxtC(fd.pronoun + ' -> ' + fd.correct, 170, C_LCD_DARK, 14);
    drawDynamicText(fd.full, 210, C_LCD_DARK, 12);
    if (t > 1600) {
      if (S.lives > 0) {
        if (Math.floor(t/400) % 2 === 0) ptxtC('NEXT SENTENCE', 250, C_LCD_DARK, 10);
      } else {
        if (Math.floor(t/400) % 2 === 0) ptxtC('NO LIVES LEFT', 250, C_LCD_DARK, 10);
      }
    }
  },
  drawLevelIntro() {
    clearScreen();
    const t = S.fbTime;
    ptxtC('LEVEL ' + S.level, H/2-20, C_LCD_DARK, 20);
    if (t > 1400) ptxtC(['','EASY','NORMAL','HARD'][S.level], H/2+15, C_LCD_DARK, 14);
    if (t > 2200) { S.screen = 'QUESTION_INTRO'; S.fbTime = 0; }
  },
  drawQuestionIntro() {
    this.draw();
    const t = S.fbTime;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(GRID_X, GRID_Y, GRID_COLS*CELL, GRID_ROWS*CELL);
    if (t < 1000) ptxtC('GET READY!', H/2-10, C_LCD_BG, 14);
    else if (t < 1400) ptxtC('GO!', H/2-15, C_LCD_BG, 24);
    else {
      S.screen = 'PLAYING';
      S.lastMove = performance.now();
      S.timer = S.maxTimer;
    }
  }
};

const Menu = {

    {name:'LEVEL 1', sub:'EASY', level:1},

  draw() {

  drawHowTo() {

    for (let i = 0; i < lines.length; i++) {

  drawLevelSelect() {

      }
      ptxt(lv.name + ' - ' + lv.sub, 55, y, locked ? 'rgba(15,56,15,0.3)' : (sel ? C_LCD_DARK : 'rgba(15,56,15,0.7)'), 14);
      if (locked) ptxt('LCK', W-55, y, 'rgba(15,56,15,0.5)', 12);
      else if (sel) ptxt('>', W-55, y, C_LCD_DARK, 14);

function drawBoot() {

function drawPaused() {

function drawGameOver() {

  const t = S.fbTime;
  if (t > 300) ptxtC('SCORE: ' + S.score, 130, C_LCD_DARK, 12);
  if (t > 600) ptxtC('CORRECT: ' + S.correctCount, 160, C_LCD_DARK, 10);
  if (t > 900) {

function drawCaseComplete() {
  clearScreen();
  const t = S.fbTime;
  ctx.strokeStyle = C_LCD_DARK; ctx.lineWidth = 2;
  roundRect(50, 70, W-100, 180, 6); ctx.stroke();
  if (t > 200) ptxtC('CASE SOLVED', 100, C_LCD_DARK, 14);
  if (t > 500) ptxtC('PERFECT!', 135, C_LCD_DARK, 12);

function draw() {
  switch (S.screen) {
    case 'BOOT': drawBoot(); break;
    case 'MENU': Menu.draw(); break;
    case 'MINI_GAMES': Menu.drawMiniGames(); break;
    case 'HOW_TO': Menu.drawHowTo(); break;
    case 'LEVEL_SELECT': Menu.drawLevelSelect(); break;
    case 'LEVEL_INTRO': Snake.drawLevelIntro(); break;
    case 'QUESTION_INTRO': Snake.drawQuestionIntro(); break;
    case 'PLAYING': Snake.draw(); break;
    case 'PAUSED': drawPaused(); break;
    case 'CORRECT': Snake.drawCorrect(); break;
    case 'WRONG': Snake.drawWrong(); break;
    case 'GAME_OVER': drawGameOver(); break;
    case 'CASE_COMPLETE': drawCaseComplete(); break;
  }
}

function update(ts) {
  if (S.screen === 'BOOT') S.bootTime += 16;
  if (S.screen === 'PLAYING') Snake.update(ts);
  const fbScreens = ['CORRECT','WRONG','LEVEL_INTRO','QUESTION_INTRO','GAME_OVER','CASE_COMPLETE'];
  if (fbScreens.includes(S.screen)) S.fbTime += 16;

  if (S.screen === 'CORRECT' && S.fbTime > 1800) Snake.nextQ();
  if (S.screen === 'WRONG') {
    if (S.lives <= 0 && S.fbTime > 2800) {
      Sound.play('gameOver');
      S.screen = 'GAME_OVER'; S.fbTime = 0;
    } else if (S.lives > 0 && S.fbTime > 3200) {
      Snake.nextQ();
    }
  }
}

function setupInput() {
  Input.on('up', () => {
    if (S.screen === 'MENU') S.menuIndex = (S.menuIndex - 1 + Menu.items.length) % Menu.items.length;
    else if (S.screen === 'MINI_GAMES') S.gameIndex = (S.gameIndex - 1 + Menu.games.length) % Menu.games.length;
    else if (S.screen === 'LEVEL_SELECT') { if (S.levelIndex > 0) S.levelIndex--; }
    else if (S.screen === 'PLAYING') Snake.setDir(0, -1);
  });
  Input.on('down', () => {
    if (S.screen === 'MENU') S.menuIndex = (S.menuIndex + 1) % Menu.items.length;
    else if (S.screen === 'MINI_GAMES') S.gameIndex = (S.gameIndex + 1) % Menu.games.length;
    else if (S.screen === 'LEVEL_SELECT') {
      const n = S.levelIndex + 1;
      if (n < Menu.levels.length && (n+1) <= S.unlockedLevels) S.levelIndex = n;
    }
    else if (S.screen === 'PLAYING') Snake.setDir(0, 1);
  });
  Input.on('left', () => {
    if (S.screen === 'PLAYING') Snake.setDir(-1, 0);
  });
  Input.on('right', () => {
    if (S.screen === 'PLAYING') Snake.setDir(1, 0);
  });
  Input.on('a', () => {
    if (S.screen === 'BOOT' && S.bootTime > 2000) { S.screen = 'MENU'; return; }
    if (S.screen === 'MENU') {
      if (S.menuIndex === 0) { S.screen = 'LEVEL_SELECT'; S.levelIndex = 0; }
      else if (S.menuIndex === 1) { S.screen = 'MINI_GAMES'; S.gameIndex = 0; }
      else if (S.menuIndex === 2) S.screen = 'HOW_TO';
    } else if (S.screen === 'MINI_GAMES') {
      const g = Menu.games[S.gameIndex];
      if (!g.locked && g.id === 'snake') { S.screen = 'LEVEL_SELECT'; S.levelIndex = 0; }
    } else if (S.screen === 'LEVEL_SELECT') {
      if ((S.levelIndex + 1) <= S.unlockedLevels) {
        Snake.init(Menu.levels[S.levelIndex].level);
        S.screen = 'LEVEL_INTRO'; S.fbTime = 0;
      }
    }
  });
  Input.on('b', () => {
    if (['MINI_GAMES','HOW_TO','LEVEL_SELECT'].includes(S.screen)) S.screen = 'MENU';
  });
  Input.on('start', () => {
    if (S.screen === 'BOOT' && S.bootTime > 2000) { S.screen = 'MENU'; return; }
    if (S.screen === 'MENU') { S.screen = 'LEVEL_SELECT'; S.levelIndex = 0; return; }
    if (S.screen === 'LEVEL_SELECT') {
      if ((S.levelIndex + 1) <= S.unlockedLevels) {
        Snake.init(Menu.levels[S.levelIndex].level);
        S.screen = 'LEVEL_INTRO'; S.fbTime = 0;
      }
      return;
    }
    if (S.screen === 'PLAYING') { S.screen = 'PAUSED'; return; }
    if (S.screen === 'PAUSED') { S.screen = 'PLAYING'; S.lastMove = performance.now(); return; }
    if (S.screen === 'GAME_OVER' && S.fbTime > 1600) { S.screen = 'MENU'; return; }
    if (S.screen === 'CASE_COMPLETE' && S.fbTime > 2000) { S.screen = 'MENU'; return; }
  });
  Input.on('select', () => Sound.toggle());
}

function init() {
  S.unlockedLevels = Storage.get('unlockedLevels', 1);
  S.highScore = Storage.get('highScore', 0);
  Sound.init();
  Input.init();
  setupInput();
  requestAnimationFrame(loop);
}

function loop(ts) {
  update(ts);
  draw();
  requestAnimationFrame(loop);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
